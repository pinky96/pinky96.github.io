# =============================================================
# Señales del Micelio — configuración general del sitio
# =============================================================
# Este archivo controla los datos globales del sitio. Jekyll lo lee
# una sola vez al arrancar: si lo cambias, reinicia el servidor local
# (bundle exec jekyll serve) para ver los cambios.
#
# Cualquier variable definida aquí queda disponible en las plantillas
# como {{ site.nombre_de_la_variable }}.
# -------------------------------------------------------------

# --- Identidad del sitio -------------------------------------
title: Señales del Micelio
description: Imágenes y escritos sobre tecnología, sociedad civil y otras señales
lema: Bitácora que crece por debajo de la superficie

# --- Direcciones ---------------------------------------------
# url: dominio completo donde vive el sitio (sin barra final).
# baseurl: subcarpeta, solo si el sitio NO está en la raíz del dominio.
# Como este es un sitio de usuario (pinky96.github.io), baseurl va vacío.
url: "https://pinky96.github.io"
baseurl: ""

# --- Autora y redes ------------------------------------------
autora: Pinky
github_username: pinky96

# --- Estructura de las URLs de cada entrada ------------------
# /blog/titulo-de-la-entrada/
# (si cambias esto después de publicar, los enlaces viejos se rompen)
permalink: /blog/:title/

# --- Portada --------------------------------------------------
# Cuántas entradas mostrar en la cuadrícula de la portada
# (además de la entrada destacada).
entradas_en_portada: 9

# --- Archivos que Jekyll debe ignorar al construir el sitio ---
exclude:
  - README.md
  - plantilla-entrada.md
  - Gemfile
  - Gemfile.lock
  - vendor/
